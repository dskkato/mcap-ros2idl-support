name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check tag matches Python and Rust package versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          python_version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          rust_version = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{python_version}" or python_version != rust_version:
              raise SystemExit(
                  f"Version mismatch: tag={tag}, Python={python_version}, Rust={rust_version}"
              )
          print(f"Validated release {tag}")
          PY

  build:
    name: Build release distributions
    needs: validate
    uses: ./.github/workflows/package-build.yml

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: pypi
      url: https://pypi.org/project/mcap-ros2idl-support/
    permissions:
      id-token: write
    steps:
      - name: Download tested distributions
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish distributions with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
