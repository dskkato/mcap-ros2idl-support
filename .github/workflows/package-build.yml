name: Package build

on:
  push:
    branches: [develop]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  wheels:
    name: Wheel (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            interpreter: python3.10
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            interpreter: python3.10
          - platform: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            interpreter: python
          - platform: macos-x86_64
            os: macos-15-intel
            target: x86_64-apple-darwin
            interpreter: python
          - platform: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            interpreter: python
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      # abi3-py310 produces one wheel per platform for CPython 3.10 and newer.
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          command: build
          target: ${{ matrix.target }}
          manylinux: '2014'
          rust-toolchain: stable
          args: --release --locked --out dist --interpreter ${{ matrix.interpreter }}
      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest
      - name: Test installed wheel
        run: |
          # Run outside the checkout so imports resolve to the installed wheel.
          cd "$RUNNER_TEMP"
          python -c "import mcap_ros2idl_support._native"
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests"
      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.platform }}
          path: dist/*.whl
          if-no-files-found: error

  linux-python-tests:
    name: Linux x86_64 / Python ${{ matrix.python-version }}
    needs: wheels
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      - name: Download Linux x86_64 wheel
        uses: actions/download-artifact@v4
        with:
          name: wheel-linux-x86_64
          path: dist
      - name: Install wheel and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl pytest
      - name: Test installed wheel
        run: |
          # Every Python version uses the same wheel; no Rust build is needed.
          cd "$RUNNER_TEMP"
          python -c "import mcap_ros2idl_support._native"
          python -m pytest --import-mode=importlib "$GITHUB_WORKSPACE/tests"

  sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build source distribution
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload source distribution
        uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error
