[package]
name = "mcap-ros2idl-support"
version = "0.1.3"
edition = "2021"
license = "MIT"
description = "Native CDR decoder for mcap-ros2idl-support"
include = ["src/**", "Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "DESIGN.md"]

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module", "abi3-py310"] }

[profile.release]
lto = "thin"
codegen-units = 1
